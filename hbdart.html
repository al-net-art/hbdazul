<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAYYYYY</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f0f0f0;
        }

        .image-card {
            width: 90%;
            max-width: 1200px;

            border-radius: 25px;
            overflow: hidden;

            background: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <div class="image-card">
        <img src="IMG_2691.PNG" alt="Birthday Image">
