<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 21th Birthday Azul!</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/plugins/DataTables/datatables.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="mail.scss">

    <script src="assets/js/jquery-3.7.1.min.js"></script>

    <style>
        body{
            margin:0;
            height:100vh;
            background:rgb(25,28,32);
            overflow:hidden;
        }

        #mail-screen{
            position:fixed;
            inset:0;
            display:flex;
            justify-content:center;
            align-items:center;
            background:rgb(25,28,32);
            z-index:1000;
        }

        #main-content{
            position:fixed;
            inset:0;
            display:none;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            opacity:0;
        }

        h1{
            color:white;
            margin-bottom:30px;
        }

        .btn{
            background-color:rgb(95,117,143);
            color:white;
            width:120px;
            transition:.3s;
        }

        .btn:hover{
            background-color:rgb(178,204,220);
            color:white;
            transform:translateY(-3px);
        }


        .fadeOut{
            animation:fadeOut 0.5s forwards;
        }

        .fadeIn{
            animation:fadeIn 0.5s forwards;
        }

        @keyframes fadeOut{
            from{
                opacity:1;
            }
            to{
                opacity:0;
                transform:scale(.95);
            }
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(40px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>
</head>

<body>

<div id="mail-screen">

    <div class="letter-image">
        <div class="animated-mail">
            <div class="back-fold"></div>

            <div class="letter">
                <div class="letter-border"></div>
                <div class="letter-title"></div>
                <div class="letter-context"></div>

                <div class="letter-stamp">
                    <div class="letter-stamp-inner"></div>
                </div>
            </div>

            <div class="top-fold"></div>
            <div class="body"></div>
            <div class="left-fold"></div>

        </div>

        <div class="shadow"></div>

    </div>

</div>

<div id="main-content">

    <h1><b>ARE YOU ADITYA ZULFAN HAWARI?</b></h1>

    <div class="d-flex gap-3">
        <a href="yes1.html" class="btn">YES</a>
        <a href="no1.html" class="btn">NO</a>
    </div>

</div>

<script>

window.onload=function(){

    // Lama animasi amplop
    setTimeout(function(){

        document.getElementById("mail-screen")
            .classList.add("fadeOut");

        setTimeout(function(){

            document.getElementById("mail-screen")
                .style.display="none";

            let main=document.getElementById("main-content");

            main.style.display="flex";

            setTimeout(function(){
                main.classList.add("fadeIn");
            },100);

        },1000);

    },4000);

}

</script>

</body>
</html>
