<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 21th Birthday Azul!</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/plugins/DataTables/datatables.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            margin:0;
            height:100vh;
            background:rgb(25,28,32);
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            display:flex;
            flex-direction:column;
            align-items:center;
            animation:slideDown 1s ease-out;
        }

        h1{
            margin-bottom:30px;
            font-weight:bold;
            letter-spacing:2px;
        }

        .btn{
            background-color:rgb(95,117,143);
            color:white;
            width:120px;
            transition:.3s;
        }

        .btn:hover{
            background-color:rgb(178,204,220);
            color:white;
            transform:translateY(-3px);
        }

        @keyframes slideDown{
            from{
                opacity:0;
                transform:translateY(-100px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1 class="text-light">ARE YOU ADITYA ZULFAN HAWARI?</h1>

    <div class="d-flex gap-3">
        <a href="yes2.html" class="btn">YES</a>
        <a href="no2.html" class="btn">NO</a>
    </div>
</div>

</body>
</html>
